name: Build CampusX Desktop (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Windows build: compiles the Flutter Windows app AND packages it into a
  # single CampusXSetup.exe installer via Inno Setup.
  #
  # Secrets are injected at build time via --dart-define-from-file, so no key
  # is ever committed to the repo. Configure these once under
  # Settings -> Secrets and variables -> Actions:
  #   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (or legacy SUPABASE_ANON_KEY), GEMINI_API_KEY
  # (GEMINI_API_KEY may be a single key or a comma-separated list assigned to
  # GEMINI_API_KEYS for automatic failover — see lib/core/config/env.dart)
  # ===========================================================================
  build-windows:
    name: Build Windows Desktop (x64) + Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # The windows/ platform folder must be generated by the *actual* Flutter
      # SDK running the build, not hand-authored — the native runner/CMake
      # scaffold is version-sensitive (plugin registration, UNICODE defines,
      # etc.) and drifts from what any hand-written copy can reliably match.
      # We regenerate it fresh every run, then layer just our branding
      # (app icon, exe name) on top of the authentic template.
      - name: Regenerate native Windows platform scaffold
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows .

      - name: Apply CampusX branding to the generated scaffold
        shell: pwsh
        run: |
          Copy-Item -Path "branding\app_icon.ico" -Destination "windows\runner\resources\app_icon.ico" -Force
          (Get-Content windows\CMakeLists.txt) -replace 'set\(BINARY_NAME ".*"\)', 'set(BINARY_NAME "CampusX")' | Set-Content windows\CMakeLists.txt
          (Get-Content windows\runner\main.cpp) -replace 'CreateAndShow\(L".*?",', 'CreateAndShow(L"CampusX",' | Set-Content windows\runner\main.cpp
          (Get-Content windows\runner\Runner.rc) -replace '"CompanyName", ".*?"', '"CompanyName", "Plateau High Zone"' -replace '"FileDescription", ".*?"', '"FileDescription", "CampusX Desktop"' -replace '"ProductName", ".*?"', '"ProductName", "CampusX"' | Set-Content windows\runner\Runner.rc

      - name: Install dependencies
        run: flutter pub get

      - name: Write build-time env file
        shell: pwsh
        run: |
          $envJson = @{
            SUPABASE_URL      = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
            GEMINI_API_KEY    = "${{ secrets.GEMINI_API_KEY }}"
            GEMINI_API_KEYS   = "${{ secrets.GEMINI_API_KEYS }}"
            GEMINI_MODEL      = "gemini-3.5-flash-lite"
          } | ConvertTo-Json
          Set-Content -Path "env.json" -Value $envJson

      - name: Build Windows Desktop (Release)
        run: flutter build windows --release --dart-define-from-file=env.json

      - name: Zip raw build output
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "campusx-windows-x64.zip"

      - name: Upload raw Windows build
        uses: actions/upload-artifact@v4
        with:
          name: campusx-windows-x64-raw
          path: campusx-windows-x64.zip
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (CampusXSetup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\campusx.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CampusXSetup
          path: installer/Output/CampusXSetup.exe
          if-no-files-found: error
