name: CampusX Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # ANDROID APK
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Enable Android
        run: flutter config --enable-android

      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------------
      # Create env.json
      # --------------------------------------------------------
      - name: Create env.json
        shell: pwsh
        run: |
          $envJson = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
            GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"
            GEMINI_API_KEYS = "${{ secrets.GEMINI_API_KEYS }}"
            GEMINI_MODEL = "gemini-3.5-flash-lite"
          } | ConvertTo-Json

          Set-Content -Path "env.json" -Value $envJson

      # --------------------------------------------------------
      # Fix Kotlin incremental cache/path problem
      # --------------------------------------------------------
      - name: Disable Kotlin incremental compilation
        shell: pwsh
        run: |
          Add-Content android/gradle.properties ""
          Add-Content android/gradle.properties "kotlin.incremental=false"

      # --------------------------------------------------------
      # Clean previous build/cache
      # --------------------------------------------------------
      - name: Flutter Clean
        run: flutter clean

      - name: Clean Gradle
        shell: pwsh
        working-directory: android
        run: .\gradlew.bat clean

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=env.json

      # --------------------------------------------------------
      # Upload APK
      # --------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: campusx-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  # ============================================================
  # WINDOWS
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------------
      # Create env.json
      # --------------------------------------------------------
      - name: Create env.json
        shell: pwsh
        run: |
          $envJson = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
            GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"
            GEMINI_API_KEYS = "${{ secrets.GEMINI_API_KEYS }}"
            GEMINI_MODEL = "gemini-3.5-flash-lite"
          } | ConvertTo-Json

          Set-Content -Path "env.json" -Value $envJson

      # --------------------------------------------------------
      # Build Windows
      # --------------------------------------------------------
      - name: Build Windows
        run: flutter build windows --release --dart-define-from-file=env.json

      # --------------------------------------------------------
      # Verify Windows build
      # --------------------------------------------------------
      - name: Verify Windows build
        shell: pwsh
        run: |
          if (!(Test-Path "build\windows\x64\runner\Release")) {
            Write-Error "Windows build directory was not created."
            exit 1
          }

      # --------------------------------------------------------
      # Build installer
      # --------------------------------------------------------
      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iss = "installer\campusx.iss"

          if (!(Test-Path $iss)) {
            Write-Error "Installer script not found: $iss"
            exit 1
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
            exit 1
          }

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed."
            exit $LASTEXITCODE
          }

      # --------------------------------------------------------
      # Upload Windows application
      # --------------------------------------------------------
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: campusx-windows-build
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error

      # --------------------------------------------------------
      # Upload installer
      # --------------------------------------------------------
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: campusx-windows-installer
          path: installer/output/**
          if-no-files-found: warn
