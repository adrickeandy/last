name: CampusX Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # ANDROID APK
  # ============================================================
  build-android:
    name: Build Android APK
    runs-on: windows-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Enable Android
        run: flutter config --enable-android

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------------
      # Create env.json
      # --------------------------------------------------------
      - name: Create env.json
        shell: pwsh
        run: |
          $envJson = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
            GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"
            GEMINI_API_KEYS = "${{ secrets.GEMINI_API_KEYS }}"
            GEMINI_MODEL = "gemini-3.5-flash-lite"
          } | ConvertTo-Json

          Set-Content -Path "env.json" -Value $envJson

      # --------------------------------------------------------
      # Create gradle.properties if missing
      # Fix Kotlin incremental cache problem
      # --------------------------------------------------------
      - name: Configure Kotlin
        shell: pwsh
        run: |
          $file = "android/gradle.properties"

          if (!(Test-Path "android")) {
            Write-Error "Android directory does not exist."
            exit 1
          }

          if (!(Test-Path $file)) {
            New-Item -ItemType File -Path $file -Force | Out-Null
            Write-Host "Created android/gradle.properties"
          }

          $content = Get-Content $file -ErrorAction SilentlyContinue

          if ($content -notcontains "kotlin.incremental=false") {
            Add-Content $file "kotlin.incremental=false"
          }

          Write-Host "Current android/gradle.properties:"
          Get-Content $file

      # --------------------------------------------------------
      # Clean Flutter
      # --------------------------------------------------------
      - name: Flutter Clean
        run: flutter clean

      # --------------------------------------------------------
      # Clean Gradle
      # --------------------------------------------------------
      - name: Clean Gradle
        shell: pwsh
        working-directory: android
        run: |
          .\gradlew.bat clean

      # --------------------------------------------------------
      # Build APK
      # --------------------------------------------------------
      - name: Build Android APK
        run: |
          flutter build apk --release --dart-define-from-file=env.json

      # --------------------------------------------------------
      # Verify APK
      # --------------------------------------------------------
      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "build/app/outputs/flutter-apk/app-release.apk"

          if (!(Test-Path $apk)) {
            Write-Error "APK was not created."
            exit 1
          }

          Write-Host "APK successfully created:"
          Get-Item $apk | Select-Object FullName, Length

      # --------------------------------------------------------
      # Upload APK
      # --------------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: campusx-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  # ============================================================
  # WINDOWS BUILD
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Flutter Pub Get
        run: flutter pub get

      # --------------------------------------------------------
      # Create env.json
      # --------------------------------------------------------
      - name: Create env.json
        shell: pwsh
        run: |
          $envJson = @{
            SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
            SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
            SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
            GEMINI_API_KEY = "${{ secrets.GEMINI_API_KEY }}"
            GEMINI_API_KEYS = "${{ secrets.GEMINI_API_KEYS }}"
            GEMINI_MODEL = "gemini-3.5-flash-lite"
          } | ConvertTo-Json

          Set-Content -Path "env.json" -Value $envJson

      # --------------------------------------------------------
      # Build Windows
      # --------------------------------------------------------
      - name: Build Windows
        run: |
          flutter build windows --release --dart-define-from-file=env.json

      # --------------------------------------------------------
      # Verify Windows build
      # --------------------------------------------------------
      - name: Verify Windows build
        shell: pwsh
        run: |
          $folder = "build/windows/x64/runner/Release"

          if (!(Test-Path $folder)) {
            Write-Error "Windows build directory was not created."
            exit 1
          }

          Write-Host "Windows build created successfully."

      # --------------------------------------------------------
      # Build Inno Setup Installer
      # --------------------------------------------------------
      - name: Build Windows Installer
        shell: pwsh
        run: |
          $iss = "installer/campusx.iss"

          if (!(Test-Path $iss)) {
            Write-Error "Installer script not found: $iss"
            exit 1
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
            exit 1
          }

          Write-Host "Building installer..."

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed."
            exit $LASTEXITCODE
          }

          Write-Host "Installer built successfully."

      # --------------------------------------------------------
      # Upload Windows Build
      # --------------------------------------------------------
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: campusx-windows-build
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error

      # --------------------------------------------------------
      # Upload Installer
      # --------------------------------------------------------
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: campusx-windows-installer
          path: |
            installer/output/**
            installer/*.exe
            output/*.exe
          if-no-files-found: warn
